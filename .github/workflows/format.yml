name: Format check

on:
  push:
    branches: [main, ben, hofi]
  pull_request:

jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check formatting
        run: npx --yes prettier@3.6.2 --check .
