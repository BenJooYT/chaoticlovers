name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write site stats
        run: |
          paths=('*.html' '*.css' '*.js' '*.json' '*.jsonl' '*.yml' '*.yaml')
          lines=$(git ls-files -z "${paths[@]}" | xargs -0 cat | wc -l)
          files=$(git ls-files "${paths[@]}" | wc -l)
          printf '{"lines": %d, "files": %d, "generated": "%s"}\n' \
            "$lines" "$files" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > public/stats.json
          cat public/stats.json

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
