name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Write site stats
        run: |
          paths=('*.html' '*.css' '*.js' '*.json' '*.jsonl' '*.yml' '*.yaml')
          lines=$(git ls-files -z "${paths[@]}" | xargs -0 cat | wc -l)
          files=$(git ls-files "${paths[@]}" | wc -l)
          printf '{"lines": %d, "files": %d, "generated": "%s"}\n' \
            "$lines" "$files" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > public/stats.json
          cat public/stats.json

      - name: Write history feed
        run: |
          git log --date=short --pretty=format:'%h%x1f%ad%x1f%s%x1e' HEAD \
            | python3 -c '
          import json, sys
          raw = sys.stdin.read()
          commits = []
          for chunk in raw.split("\x1e"):
              chunk = chunk.strip()
              if not chunk:
                  continue
              sha, date, subject = chunk.split("\x1f", 2)
              commits.append({"sha": sha, "date": date, "subject": subject})
          print(json.dumps({"commits": commits[:40]}))
          ' > public/history.json
          head -c 300 public/history.json; echo

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
